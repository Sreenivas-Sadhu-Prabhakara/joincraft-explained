<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:      #1D2126;
    --panel:   #262C33;
    --panel2:  #2E353D;
    --line:    #3A424B;
    --ink:     #E9EDF0;
    --muted:   #9AA7B0;
    --accent:  #D7F84B;
    --accent-ink: #161A10;
    --orphan:  #6B7680;
    --danger:  #FF8A5B;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(1200px 620px at 84% -12%, rgba(215,248,75,0.10), transparent 60%),
      radial-gradient(900px 520px at 4% 6%, rgba(215,248,75,0.05), transparent 55%),
      linear-gradient(180deg, #1b1f24 0%, #1D2126 100%);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    position: absolute; inset: 0; padding: 76px 84px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .mark { width: 74px; height: 74px; border-radius: 18px; box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7); }
  .wordmark { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: var(--muted); }
  .wordmark b { color: var(--ink); }

  .mid { display: flex; align-items: center; gap: 40px; }
  .copy { max-width: 620px; }
  .copy h1 {
    font-size: 55px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; color: var(--ink);
  }
  .copy .strike { position: relative; color: var(--muted); white-space: nowrap; }
  .copy .strike::after { content:""; position:absolute; left:-2%; right:-2%; top:52%; height:5px; background: var(--danger); transform: rotate(-4deg); border-radius:3px; }
  .copy .accent { color: var(--accent); }
  .copy p { margin-top: 22px; font-size: 25px; font-weight: 500; color: var(--muted); line-height: 1.35; max-width: 26ch; }

  .fig { flex: 0 0 auto; }

  .chips { display: flex; align-items: center; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(20,24,28,0.5);
    font-size: 22px; font-weight: 600; color: var(--muted);
  }
  .chip .dot { width: 11px; height: 11px; border-radius: 50%; }
  .chip .dot--acc { background: var(--accent); box-shadow: 0 0 0 4px rgba(215,248,75,0.16); }
  .chip .dot--org { background: var(--orphan); box-shadow: 0 0 0 4px rgba(107,118,128,0.18); }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#262C33"/>
        <rect x="4" y="14" width="8" height="4" rx="1.4" fill="#2E353D" stroke="#3A424B" stroke-width="0.6"/>
        <rect x="22" y="6"  width="7" height="4" rx="1.4" fill="#2E353D" stroke="#3A424B" stroke-width="0.6"/>
        <rect x="22" y="14" width="7" height="4" rx="1.4" fill="#2E353D" stroke="#3A424B" stroke-width="0.6"/>
        <rect x="22" y="22" width="7" height="4" rx="1.4" fill="#2E353D" stroke="#3A424B" stroke-width="0.6"/>
        <path d="M12 16 C 17 16, 17 8,  22 8"  fill="none" stroke="#D7F84B" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M12 16 C 17 16, 17 16, 22 16" fill="none" stroke="#D7F84B" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M12 16 C 17 16, 17 24, 22 24" fill="none" stroke="#D7F84B" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <span class="wordmark">joins, <b>explained honestly</b></span>
    </div>

    <div class="mid">
      <div class="copy">
        <h1>The <span class="strike">Venn diagram</span> lies about <span class="accent">SQL joins</span>.</h1>
        <p>One row fans out to many. A NULL never matches. See what really happens.</p>
      </div>
      <svg class="fig" width="330" height="260" viewBox="0 0 330 260" aria-hidden="true">
        <!-- crossed-out venn -->
        <circle cx="78"  cy="70" r="46" fill="rgba(154,167,176,0.10)" stroke="#9AA7B0" stroke-width="2"/>
        <circle cx="128" cy="70" r="46" fill="rgba(154,167,176,0.10)" stroke="#9AA7B0" stroke-width="2"/>
        <line x1="38" y1="24" x2="168" y2="116" stroke="#FF8A5B" stroke-width="6" stroke-linecap="round"/>
        <!-- the honest fan: 1 -> 3 -->
        <rect x="30"  y="176" width="70" height="26" rx="6" fill="#2E353D" stroke="#3A424B" stroke-width="1.6"/>
        <rect x="238" y="150" width="70" height="26" rx="6" fill="#2E353D" stroke="#3A424B" stroke-width="1.6"/>
        <rect x="238" y="186" width="70" height="26" rx="6" fill="#2E353D" stroke="#3A424B" stroke-width="1.6"/>
        <rect x="238" y="222" width="70" height="26" rx="6" fill="#2E353D" stroke="#3A424B" stroke-width="1.6"/>
        <path d="M100 189 C 170 189, 170 163, 238 163" fill="none" stroke="#D7F84B" stroke-width="6" stroke-linecap="round"/>
        <path d="M100 189 C 170 189, 170 199, 238 199" fill="none" stroke="#D7F84B" stroke-width="6" stroke-linecap="round"/>
        <path d="M100 189 C 170 189, 170 235, 238 235" fill="none" stroke="#D7F84B" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="chips">
      <span class="chip"><span class="dot dot--acc"></span>duplicate-key blowup</span>
      <span class="chip"><span class="dot dot--org"></span>NULL never matches</span>
      <span class="chip"><span class="dot dot--acc"></span>runs offline</span>
    </div>
  </div>
</body>
</html>
